name: Build TWRP Recovery for Moto G Stylus 2025 (mona)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-12.1
        - twrp-14
        - twrp-11

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free Disk Space
      run: |
        echo "=== Disk space before cleanup ==="
        df -h
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache \
          /usr/share/swift \
          /usr/local/.ghcup \
          /var/lib/docker || true
        sudo docker system prune -a -f || true
        sudo apt-get clean || true
        echo "=== Disk space after cleanup ==="
        df -h

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/motorola/mona

    - name: Set up Environment & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libncurses6 x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
          python3 python-is-python3 rsync libssl-dev bc cpio
        mkdir -p ~/bin
        curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        git config --global user.name "Builder"
        git config --global user.email "builder@localhost"
        git config --global --add safe.directory "*"

    - name: Initialize TWRP Minimal Manifest
      run: |
        BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        if [ -z "$BRANCH" ]; then
          BRANCH="twrp-12.1"
        fi
        echo "Using TWRP Manifest Branch: $BRANCH"
        mkdir -p /home/runner/twrp
        cd /home/runner/twrp
        repo init --no-repo-verify --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $BRANCH
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j4 || repo sync -c --no-clone-bundle --no-tags -j2

    - name: Copy Device Tree
      run: |
        rm -rf /home/runner/twrp/device/motorola/mona
        mkdir -p /home/runner/twrp/device/motorola/mona
        cp -r $GITHUB_WORKSPACE/device/motorola/mona/* /home/runner/twrp/device/motorola/mona/
        ls -la /home/runner/twrp/device/motorola/mona/

    - name: Build Recovery
      run: |
        cd /home/runner/twrp
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export WITHOUT_CHECK_API=true
        export LC_ALL="C"
        lunch twrp_mona-eng || lunch omni_mona-eng || lunch twrp_mona-userdebug
        mka recoveryimage -j$(nproc --all) || make recoveryimage -j$(nproc --all)

    - name: Upload TWRP Recovery Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: TWRP-mona-recovery
        path: |
          /home/runner/twrp/out/target/product/mona/recovery.img
          /home/runner/twrp/out/target/product/mona/boot.img
          /home/runner/twrp/out/target/product/mona/*.img

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      continue-on-error: true
      with:
        files: |
          /home/runner/twrp/out/target/product/mona/recovery.img
        tag_name: build-${{ github.run_number }}
        name: TWRP Recovery for Moto G Stylus 2025 (mona) #${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
